<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふたりの旅ノート</title>
<meta name="theme-color" content="#2f7d6d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅ノート">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#e5e3de;--accent:#2f7d6d;--accent-soft:#e3f1ed;--warn:#b42318;--warn-soft:#fde8e6;--gold:#a16207;--gold-soft:#fdf3d7}
@media (prefers-color-scheme:dark){:root{--bg:#111312;--card:#1c1f1e;--ink:#f2f2f0;--muted:#9a9e9c;--line:#2d3231;--accent:#5cbfa8;--accent-soft:#1f3631;--warn:#f87171;--warn-soft:#3b1a1a;--gold:#facc15;--gold-soft:#3a3116}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
h1{font-size:1.3rem;margin:0}h2{font-size:1rem;margin:1.2em 0 .5em;color:var(--muted)}h3{font-size:1rem;margin:0 0 .5em}
.muted{color:var(--muted)}.small{font-size:.85rem}.pre{white-space:pre-wrap;overflow-wrap:anywhere}
html,body{overflow-x:clip}
h2,.cand dd,.title{overflow-wrap:anywhere}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center}.gap{gap:.5rem;flex-wrap:wrap}
.center{padding:4rem 1rem;text-align:center}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(9rem + env(safe-area-inset-bottom))}
.ic{flex-shrink:0;vertical-align:-.2em}
.btn .ic{margin-left:-.15em}
.main{padding:0 16px}
.banner{background:var(--gold-soft);color:var(--gold);font-size:.8rem;padding:.4rem 16px;text-align:center}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3em;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.55rem .9rem;font:inherit;font-size:.92rem;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#042f2e}}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.big{font-size:1.05rem;padding:.8rem 1.4rem}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:.9rem;padding:.2rem 0;cursor:pointer;text-decoration:underline}
.icon-btn{background:none;border:0;font-size:1.25rem;padding:.4rem;cursor:pointer;color:var(--ink)}
.login{text-align:center;padding:5rem 1.5rem}.login .logo{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:20px;background:var(--accent);color:#fff}.login h1{font-size:1.6rem;margin:.4rem 0}.err{color:var(--warn)}
.home-head{padding:1.2rem 16px .6rem}
.trip-card{display:flex;align-items:center;gap:.8rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin:.5rem 0;color:inherit;text-decoration:none}
.trip-ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);flex:none}
.brand-ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;margin-right:.5rem}
.cat-ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);flex:none;margin-right:.55rem}
.line{display:flex;align-items:center}.trip-name{font-weight:700}
.badge{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:.15rem .6rem;font-size:.8rem;font-weight:700;white-space:nowrap}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:1.5rem 1rem;text-align:center;color:var(--muted);margin:1rem 0;font-size:.92rem}
.empty .btn{margin-top:.8rem}
.trip-head{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.trip-head>.row{padding:.5rem 8px .2rem}
.set-btn{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;padding:.2rem .5rem;cursor:pointer}
.back{display:flex;padding:.2rem;color:var(--ink)}
.trip-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(7,1fr);max-width:760px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;min-width:0}
.tabbar a.on{color:var(--accent);font-weight:600}
.tab-label{font-size:11px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin:.7rem 0}
.count{display:flex;align-items:baseline;justify-content:center;gap:.4rem;padding:1.2rem 0 .4rem;color:var(--muted)}.count b{font-size:3rem;color:var(--accent);line-height:1}
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:.3rem 0 .6rem}.progress i{display:block;height:100%;background:var(--accent)}.progress.over i{background:var(--warn)}
.stat-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem}.stat-row>div{display:flex;flex-direction:column}.stat-row b{font-size:1.15rem}
.item{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.item.card{border:1px solid var(--line);padding:.8rem}
.item .title{font-weight:600;overflow-wrap:anywhere;line-height:1.4}
.item .time{flex:0 0 3.4rem;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:.9rem}
.item .amt{text-align:right;font-weight:700;white-space:nowrap;font-size:.92rem}
.item.todo input{width:1.3rem;height:1.3rem;margin-top:.15rem;accent-color:var(--accent);flex:none}
.item .time:empty{display:none}
.cand .price{font-weight:700;margin:.2rem 0}.cand details{margin-top:.3rem}.cand summary{color:var(--accent);cursor:pointer}
.cand dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;font-size:.82rem;margin:.4rem 0 0}.cand dt{color:var(--muted)}.cand dd{margin:0;overflow-wrap:anywhere}
.cand.st-決定{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.cand.st-見送り{opacity:.55}
.tag.solid{background:var(--accent);color:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none;margin-left:.5rem}.seg button{border:0;background:var(--card);color:var(--muted);font:inherit;font-size:.8rem;padding:.3rem .6rem;cursor:pointer}.seg button.on{background:var(--ink);color:var(--bg)}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.late{color:var(--warn)}
.booking-in-plan .title{color:var(--gold)}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.3rem .8rem .3rem;margin:.7rem 0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day-head{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--line)}.day-head b{color:var(--accent)}
.day .item:last-child{border-bottom:0}.pad{padding:.6rem 0}
.mini{display:inline-flex;align-items:center;justify-content:center;margin-left:auto;border:1px solid var(--line);background:none;color:var(--accent);border-radius:8px;width:2rem;height:1.8rem;cursor:pointer;font-size:1rem}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 .45rem;font-size:.75rem;font-weight:600;margin-right:.4rem;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.conf{font-size:.9rem;margin:.2rem 0}.conf b{font-family:ui-monospace,Menlo,monospace;letter-spacing:.05em}
.yen{color:var(--muted);font-weight:400;font-size:.85em}
.ext{font-size:.85rem;white-space:nowrap}
.total{text-align:right;font-weight:700}
.chips{display:flex;gap:.35rem;overflow-x:auto;padding:.7rem 0 .2rem;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:.25rem .75rem;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:.3rem}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);-webkit-overflow-scrolling:touch}
table.cmp{border-collapse:collapse;font-size:.82rem;min-width:100%}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:.5rem .6rem;text-align:left;vertical-align:top;min-width:9rem;max-width:16rem}
.cmp thead th{background:var(--bg);color:var(--muted);font-weight:600;white-space:nowrap;position:sticky;top:0}
.cmp .sticky{position:sticky;left:0;background:var(--card);z-index:1;min-width:8rem;box-shadow:1px 0 0 var(--line)}
.cmp thead .sticky{background:var(--bg);z-index:2}
.cmp tr{cursor:pointer}
.cmp tr.st-決定 .sticky,.cmp tr.st-決定 td{background:var(--accent-soft)}
.cmp tr.st-見送り{opacity:.5}
.note.imp-高{border-left:4px solid var(--warn)}.note.imp-低{opacity:.8}
.line{padding:.3rem 0;cursor:pointer}
.fab{position:fixed;display:inline-flex;align-items:center;gap:.3rem;right:max(16px,calc(50% - 364px));bottom:calc(58px + 1rem + env(safe-area-inset-bottom));z-index:6;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:.8rem 1.2rem;font:inherit;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
@media (prefers-color-scheme:dark){.fab{color:#042f2e}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:.6rem .6rem .4rem 16px;border-bottom:1px solid var(--line)}
.sheet-body{overflow-y:auto;padding:.6rem 16px}
.sheet-foot{display:flex;gap:.5rem;padding:.7rem 16px calc(.7rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.field{display:block;margin:.55rem 0}.field>span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.2rem}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem}
select{width:auto;min-width:5rem}.field>select{width:100%}
input.invalid{border-color:var(--warn)}
.sheet-src{display:flex;align-items:center;gap:.4rem;padding:.8rem 0 .2rem;color:var(--muted)}
.mini.wide{width:auto;padding:0 .6rem;font-size:.8rem;text-decoration:none;font:inherit;font-size:.8rem}
.checks{display:flex;flex-direction:column;gap:.1rem;margin-bottom:.6rem}
.check{display:flex;align-items:center;gap:.5rem;font-size:.9rem;padding:.25rem 0}.check input{width:1.1rem;height:1.1rem;accent-color:var(--accent);flex:none}
h2.row{display:flex;align-items:center}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.15rem}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cal-on{display:inline-flex;vertical-align:middle;margin-left:.35rem;color:var(--accent);opacity:.8}
.meta{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem;align-items:center}
.pill{display:inline-flex;align-items:center;gap:.2rem;border-radius:99px;padding:.1rem .55rem;font-size:.75rem;font-weight:600;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.red{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.amber{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.green{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.more{display:inline-flex;align-items:center;gap:.15rem;font-size:.72rem;color:var(--muted)}
.tpill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:.05rem .4rem;font-size:.82rem;font-weight:700}
.price{font-size:1.05rem;font-weight:700;margin:.25rem 0 .1rem;color:var(--ink)}
.todo-line{display:flex;gap:.3rem;align-items:flex-start;margin-top:.35rem;color:var(--accent)}.todo-line .ic{margin-top:.15rem}
h3.sub{font-size:.85rem;color:var(--muted);margin:1rem 0 .3rem;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(58px + 5rem);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;z-index:30;font-size:.9rem;max-width:90vw}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
